[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "f88445d971d6b7dfd6336d73e52dc0411921f5bf", default-features = false }

[build-dependencies]
mrr-data-asp-rust-project-policy.workspace = true

[lints]
workspace = true
