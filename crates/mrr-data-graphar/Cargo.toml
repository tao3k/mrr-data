upstream-graphar = ["dep:graphar-rs", "dep:tempfile"]

[dependencies]
graphar-rs = { git = "https://github.com/GTrunSec/incubator-graphar", rev = "1a3706283ed2225350ec5016e81fc33d3b0b14ef", optional = true }
