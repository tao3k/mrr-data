[package]
name = "mrr-data-graphar"
description = "Fail-closed MRR binary-Entity projection contracts for Apache GraphAr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native-graphar = ["dep:arrow-array", "dep:graphar-rs", "dep:tempfile"]

[dependencies]
arrow-array = { workspace = true, optional = true }
graphar-rs = { git = "https://github.com/GTrunSec/incubator-graphar", rev = "5230a5119b0d469db666b1ea035bdfb95c7b7611", optional = true }
meta-relational-reasoning.workspace = true
mrr-data-profile.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "3ddd7a15d1e69da4a67e0e0ab84b056fe90d838d", default-features = false }
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "3ddd7a15d1e69da4a67e0e0ab84b056fe90d838d" }

[build-dependencies]
mrr-data-asp-rust-project-policy.workspace = true

[lints]
workspace = true
