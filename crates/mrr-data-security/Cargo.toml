[package]
name = "mrr-data-security"
description = "Provider-neutral security and privacy bindings for MRR Data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
raw-publish = ["dep:mrr-data-content", "mrr-data-content/transfer", "dep:meta-relational-reasoning"]
protected-envelope = ["dep:ring", "dep:zeroize", "dep:mrr-data-content"]
protected-publish = ["protected-envelope", "raw-publish", "mrr-data-content/filesystem"]

[dependencies]
cid.workspace = true
mrr-data-core = { workspace = true, features = ["content-identity"] }
mrr-data-content = { workspace = true, optional = true }
meta-relational-reasoning = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
zeroize = { version = "1.9.0", optional = true }

[dev-dependencies]
meta-relational-reasoning.workspace = true
mrr-data-asp-rust-build-support.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "input_binding"
path = "benches/input_binding.rs"
harness = false
