[package]
name = "mrr-data-turso-query"
description = "Physical Turso graph-query execution for MRR Data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
turso-graphar = ["dep:turso", "dep:tokio", "mrr-data-graphar/native-graphar"]
backend-worker = ["turso-graphar", "dep:mrr-data-backend", "mrr-data-backend/turso"]

[dependencies]
meta-relational-reasoning.workspace = true
mrr-data-core = { workspace = true, features = ["content-identity"] }
mrr-data-backend = { workspace = true, optional = true }
mrr-data-graphar = { path = "../mrr-data-graphar", version = "0.1.0", default-features = false, features = ["file-inventory"] }
turso = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
mrr-data-content.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "turso_graphar"
path = "tests/integration/turso_graphar.rs"
required-features = ["turso-graphar"]
