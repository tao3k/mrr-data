[package]
name = "mrr-data-poo-flow"
description = "External MRR static-edge snapshot resource for the POO Flow runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
runtime = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tokio", "dep:reqwest", "dep:meta-relational-reasoning", "dep:mrr-data-arrow", "dep:mrr-data-core", "dep:mrr-data-content", "dep:mrr-data-cache", "dep:mrr-data-datafusion"]

[[bin]]
name = "mrr-data-poo-flow"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
meta-relational-reasoning = { workspace = true, optional = true }
mrr-data-arrow = { workspace = true, optional = true }
mrr-data-core = { workspace = true, optional = true, features = ["ipfs"] }
mrr-data-content = { workspace = true, optional = true, features = ["transfer"] }
mrr-data-cache = { workspace = true, optional = true, features = ["kache", "s3", "blocking"] }
mrr-data-datafusion = { workspace = true, optional = true }

[dev-dependencies]
mrr-data-asp-rust-build-support.workspace = true

[lints]
workspace = true
