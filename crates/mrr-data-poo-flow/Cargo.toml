[package]
name = "mrr-data-poo-flow"
description = "External MRR snapshot and optional source-bound property resource for POO Flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
runtime = ["dep:anyhow", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tokio", "dep:reqwest", "dep:tempfile", "dep:cid", "dep:meta-relational-reasoning", "dep:mrr-data-arrow", "dep:mrr-data-core", "dep:mrr-data-content", "dep:mrr-data-cache", "dep:mrr-data-datafusion"]
property-query = ["runtime", "dep:cid", "dep:mrr-frontends", "dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema"]

[[bin]]
name = "mrr-data-poo-flow"
path = "src/main.rs"
required-features = ["runtime"]

[dependencies]
anyhow = { workspace = true, optional = true }
cid = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
meta-relational-reasoning = { workspace = true, optional = true }
mrr-frontends = { workspace = true, optional = true }
mrr-data-arrow = { workspace = true, optional = true }
mrr-data-core = { workspace = true, optional = true, features = ["content-identity"] }
mrr-data-content = { workspace = true, optional = true, features = ["transfer", "filesystem"] }
mrr-data-cache = { workspace = true, optional = true, features = ["s3", "blocking"] }
mrr-data-datafusion = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[dev-dependencies]
mrr-data-asp-rust-build-support.workspace = true

[lints]
workspace = true
