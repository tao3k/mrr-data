[package]
name = "mrr-data-datafusion"
description = "DataFusion execution adapter for admitted MRR physical queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Optional qualification of the MRR-owned native GQL frontend handoff.
source-handoff = ["dep:mrr-property-source", "mrr-property-source/native-inference"]

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
datafusion.workspace = true
futures.workspace = true
sha2.workspace = true
meta-relational-reasoning.workspace = true
mrr-data-content = { workspace = true, features = ["snapshot"] }
mrr-data-core.workspace = true
mrr-property-source = { workspace = true, optional = true }

[dev-dependencies]
ed25519-dalek = "2.2.0"
tempfile.workspace = true
cid.workspace = true
mrr-data-arrow.workspace = true
mrr-data-asp-rust-build-support.workspace = true
tokio.workspace = true

[lints]
workspace = true
