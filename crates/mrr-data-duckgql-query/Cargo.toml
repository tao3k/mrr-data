[package]
name = "mrr-data-duckgql-query"
description = "Typed DuckGQL physical execution for MRR Data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
duckgql-graphar = ["dep:duckdb", "dep:tempfile", "dep:sha2", "mrr-data-graphar/native-graphar"]
backend-worker = ["duckgql-graphar", "dep:mrr-data-backend", "dep:tokio"]
query-parity = ["duckgql-graphar", "mrr-data-turso-query/turso-graphar"]

[dependencies]
meta-relational-reasoning.workspace = true
mrr-data-core = { workspace = true, features = ["content-identity"] }
mrr-data-graphar = { workspace = true, features = ["file-inventory"] }
serde_json.workspace = true
duckdb = { workspace = true, optional = true, features = ["json"] }
tempfile = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
mrr-data-backend = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
mrr-data-content.workspace = true
mrr-data-arrow.workspace = true
mrr-data-datafusion.workspace = true
mrr-data-turso-query.workspace = true
tempfile.workspace = true
tokio.workspace = true
turso.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true

[[test]]
name = "duckgql_graphar"
path = "tests/integration/duckgql_graphar.rs"
required-features = ["query-parity"]
