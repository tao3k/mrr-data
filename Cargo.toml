[workspace]
members = [
  "build-support/mrr-data-asp-rust-project-policy",
  "crates/mrr-data",
  "crates/mrr-data-arrow",
  "crates/mrr-data-content",
  "crates/mrr-data-backend",
  "crates/mrr-data-cache",
  "crates/mrr-data-core",
  "crates/mrr-data-security",
  "crates/mrr-data-pseudonymization",
  "crates/mrr-data-commerce",
  "crates/mrr-data-datafusion",
  "crates/mrr-data-graphar",
  "crates/mrr-data-profile",
  "crates/mrr-data-turso-query",
  "crates/mrr-data-duckgql-query",
  "crates/mrr-data-kache-probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
repository = "https://github.com/tao3k/mrr-data"

[workspace.dependencies]
mrr-data-backend = { path = "crates/mrr-data-backend", version = "0.1.0", default-features = false }
turso = { version = "=0.8.1", default-features = false }
duckdb = { version = "=1.10506.0", default-features = false, features = ["bundled", "appender-arrow"] }
serde_json = "1"
nix = { version = "=0.29.0", default-features = false, features = ["resource"] }
sha2 = "0.10"
mrr-data-cache = { path = "crates/mrr-data-cache", version = "0.1.0", default-features = false }
opendal = { package = "opendal-core", version = "=0.58.2", default-features = false, features = ["executors-tokio"] }
opendal-service-s3 = { version = "=0.58.2", default-features = false }
opendal-http-transport-reqwest = { version = "=0.58.2", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
axum = "0.8"
anyhow = "1"
blake3 = "1"
kache-store = { git = "https://github.com/kunobi-ninja/kache", rev = "7461ca763506c081d6ceb95ea225c04ce2d24df6" }
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf", default-features = false }
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf" }
arrow-array = "58.4.0"
arrow-select = "58.4.0"
bytes = "1"
parquet = { version = "=58.4.0", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-buffer = "58.4.0"
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
datafusion = { version = "=53.1.0", default-features = false }
flatbuffers = "25.2.10"
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "8f389fd0aede8d8000197c959da69b6ba3e9bb86", version = "0.1.0", default-features = false }
mrr-property-source = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "8f389fd0aede8d8000197c959da69b6ba3e9bb86", version = "0.1.0" }
