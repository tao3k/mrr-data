[workspace]
members = [
  "build-support/mrr-data-asp-rust-project-policy",
  "crates/mrr-data",
  "crates/mrr-data-poo-flow",
  "crates/mrr-data-arrow",
  "crates/mrr-data-content",
  "crates/mrr-data-cache",
  "crates/mrr-data-core",
  "crates/mrr-data-datafusion",
  "crates/mrr-data-graphar",
  "crates/mrr-data-profile",
  "crates/mrr-data-kache-probe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
repository = "https://github.com/tao3k/mrr-data"

[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
mrr-data-cache = { path = "crates/mrr-data-cache", version = "0.1.0", default-features = false }
opendal = { package = "opendal-core", version = "=0.58.2", default-features = false, features = ["executors-tokio"] }
opendal-service-s3 = { version = "=0.58.2", default-features = false }
opendal-http-transport-reqwest = { version = "=0.58.2", default-features = false, features = ["rustls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
axum = "0.8"
anyhow = "1"
blake3 = "1"
kache-store = { git = "https://github.com/kunobi-ninja/kache", rev = "7461ca763506c081d6ceb95ea225c04ce2d24df6" }
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf", default-features = false }
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "2419414ee5379bad89506496e3eaab928df68daf" }
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
datafusion = { version = "=53.1.0", default-features = false }
flatbuffers = "25.2.10"
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "fbbb753b8b28c8b22bd0e8131ace8dd42646b3fc", version = "0.1.0" }
mrr-data-asp-rust-build-support = { path = "build-support/mrr-data-asp-rust-project-policy", version = "0.1.0" }
mrr-data-arrow = { path = "crates/mrr-data-arrow", version = "0.1.0" }
mrr-data-content = { path = "crates/mrr-data-content", version = "0.1.0", default-features = false }
mrr-data-core = { path = "crates/mrr-data-core", version = "0.1.0", default-features = false }
mrr-data-datafusion = { path = "crates/mrr-data-datafusion", version = "0.1.0" }
mrr-data-graphar = { path = "crates/mrr-data-graphar", version = "0.1.0" }
mrr-data-profile = { path = "crates/mrr-data-profile", version = "0.1.0" }
cid = { version = "=0.11.3", features = ["serde"] }
fvm_ipld_car = "=0.9.1"
multihash-codetable = { version = "=0.2.2", default-features = false, features = ["sha2", "std"] }
ipld-core = { version = "=0.4.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_ipld_dagcbor = "=0.7.0"
tempfile = "=3.23.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
unsigned-varint = "=0.8.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Scenario benchmarks execute through libtest. Keep their code generation
# representative of the optimized Rust consumed by the native GraphAr bridge.
[profile.test]
opt-level = 2
codegen-units = 16
debug = false
