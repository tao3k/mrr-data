[workspace]
members = [
  "build-support/mrr-data-asp-rust-project-policy",
  "crates/mrr-data",
  "crates/mrr-data-arrow",
  "crates/mrr-data-content",
  "crates/mrr-data-core",
  "crates/mrr-data-graphar",
  "crates/mrr-data-profile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-2.1-or-later"
repository = "https://github.com/tao3k/mrr-data"

[workspace.dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "37463881f5ea5bb5a0f9f84e9a5f43f2cc9aa741", default-features = false }
asp-rust-build-support = { git = "https://github.com/tao3k/asp-rust", rev = "37463881f5ea5bb5a0f9f84e9a5f43f2cc9aa741" }
arrow-array = "58.4.0"
arrow-buffer = "58.4.0"
arrow-ipc = "58.4.0"
arrow-schema = "58.4.0"
flatbuffers = "25.2.10"
meta-relational-reasoning = { git = "https://github.com/tao3k/meta-relational-reasoning.git", rev = "ecb6728a892e527ab6f93d59500c101ba37e6623" }
mrr-data-asp-rust-project-policy = { path = "build-support/mrr-data-asp-rust-project-policy", version = "0.1.0" }
mrr-data-arrow = { path = "crates/mrr-data-arrow", version = "0.1.0" }
mrr-data-content = { path = "crates/mrr-data-content", version = "0.1.0" }
mrr-data-core = { path = "crates/mrr-data-core", version = "0.1.0" }
mrr-data-graphar = { path = "crates/mrr-data-graphar", version = "0.1.0" }
mrr-data-profile = { path = "crates/mrr-data-profile", version = "0.1.0" }
cid = { version = "=0.11.3", features = ["serde"] }
fvm_ipld_car = "=0.9.1"
multihash-codetable = { version = "=0.2.2", default-features = false, features = ["sha2", "std"] }
ipld-core = { version = "=0.4.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_ipld_dagcbor = "=0.7.0"
tempfile = "=3.23.0"
unsigned-varint = "=0.8.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Scenario benchmarks execute through libtest. Keep their code generation
# representative of the optimized Rust consumed by the native GraphAr bridge.
[profile.test]
opt-level = 2
codegen-units = 16
debug = false
