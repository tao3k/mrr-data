name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.95 MSRV (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Test workspace at the declared MSRV
        run: cargo test --workspace --features mrr-data/transfer,mrr-data/car,mrr-data/filesystem,mrr-data/cache,mrr-data/s3,mrr-data/backend-turso,mrr-data/backend-graph-publish --locked
      - name: Test native DuckDB at the declared MSRV
        run: cargo test -p mrr-data-backend --no-default-features --features duckdb,graph-publish --locked -- --nocapture

  python:
    name: Python qualification framework
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python project manager
        run: python3 -m pip install 'uv==0.11.3'
      - name: Check Python package and framework contracts
        run: |
          uv run --locked --project python ruff check python
          uv run --locked --project python ruff format --check python
          uv run --locked --project python pytest python/tests -q
          uv run --locked --project python mrr-data-test check-docs

  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python project manager
        run: python3 -m pip install 'uv==0.11.3'
      - name: Check Org documentation and links
        run: uv run --locked --project python mrr-data-test check-docs
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check fixtures against exact SPEC pin
        if: runner.os == 'Linux'
        run: uv run --locked --project python mrr-data-test check-spec-fixtures
      - name: Test workspace
        run: cargo test --workspace --features mrr-data/transfer,mrr-data/car,mrr-data/filesystem,mrr-data/cache,mrr-data/s3,mrr-data/backend-turso,mrr-data/backend-graph-publish --locked
      - name: Test optional database providers independently
        run: |
          cargo test -p mrr-data-backend --no-default-features --features turso,arrow-query,graph-publish --locked -- --nocapture
          cargo test -p mrr-data-backend --no-default-features --features duckdb,graph-publish --locked -- --nocapture
      - name: Test shared backend without a provider feature
        run: |
          cargo test -p mrr-data-backend --no-default-features --locked
          cargo test -p mrr-data-backend --no-default-features --features arrow-query --locked
      - name: Test Commerce integration profiles
        run: |
          cargo test -p mrr-data-commerce --locked
          cargo test -p mrr-data-commerce --features credential --locked
          cargo test -p mrr-data-commerce --features consumption --locked
          cargo clippy -p mrr-data-commerce --all-features --all-targets --locked -- -D warnings
          cargo clippy -p mrr-data-backend --all-features --all-targets --profile test --locked -- -D warnings
      - name: Check optional feature dependency isolation
        run: uv run --locked --project python mrr-data-test check-features
      - name: Check facade feature contract
        run: |
          cargo check -p mrr-data --locked
          cargo check -p mrr-data --no-default-features --locked
          cargo check -p mrr-data --no-default-features --features cache --locked
          cargo check -p mrr-data --no-default-features --features s3 --locked
          cargo check -p mrr-data --no-default-features --features cache,s3 --locked
          cargo check -p mrr-data --no-default-features --features content-identity,graphar --locked
          cargo test -p mrr-data --no-default-features --features datafusion --locked
          cargo test -p mrr-data --no-default-features --locked
          cargo test -p mrr-data --no-default-features --features content-identity,graphar --locked
      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Compile IPC fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Lint IPC fuzz target
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Lint workspace
        run: cargo clippy --workspace --features mrr-data/transfer,mrr-data/car,mrr-data/filesystem,mrr-data/cache,mrr-data/s3 --all-targets --locked -- -D warnings

  s3-conformance:
    name: S3 SigV4 and TLS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - name: Install compiler for the independent upstream test service
        run: rustup toolchain install 1.96.0 --profile minimal
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install POO Flow runtime dependencies
        run: |
          python3 -m pip install 'uv==0.11.3'
          uv sync --locked --project python --extra poo-flow
      - name: Test and lint the optional POO Flow resource
        run: |
          cargo test -p mrr-data-poo-flow --features runtime --locked
          cargo clippy -p mrr-data-poo-flow --features runtime --all-targets --locked -- -D warnings
      - name: Check conformance receipt freshness contracts
        run: uv run --locked --project python pytest python/tests/test_s3_receipts.py -q
      - name: Run local S3 authentication, TLS and snapshot conformance
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: uv run --locked --project python --extra poo-flow mrr-data-test s3-conformance --poo-flow --receipt "$RUNNER_TEMP/s3-conformance-receipt.json"
      - name: Summarize tested source and service
        env:
          RECEIPT_PATH: ${{ runner.temp }}/s3-conformance-receipt.json
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RECEIPT_PATH"]).read_text())
          assert receipt["result"] == "passed"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Local S3 conformance passed\n\n```json\n")
              summary.write(json.dumps(receipt, indent=2) + "\n```\n")
          PYTHON
      - name: Retain source-bound acceptance receipt
        uses: actions/upload-artifact@v7
        with:
          name: s3-conformance-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/s3-conformance-receipt.json
          if-no-files-found: error
          retention-days: 14

  snapshot-distribution-acceptance:
    name: Snapshot distribution acceptance
    if: ${{ always() }}
    needs: [msrv, test, s3-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every distribution prerequisite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["NEEDS_JSON"])
          expected = {"msrv", "test", "s3-conformance"}
          assert set(results) == expected, "missing snapshot distribution prerequisite"
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          assert not failures, f"Snapshot distribution acceptance incomplete: {failures}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Snapshot distribution acceptance passed: MSRV, workspace/feature checks and independent S3/TLS on Ubuntu and macOS.\n")
          PYTHON

  fuzz:
    name: Arrow IPC fuzz (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded ASan IPC campaign
        run: cargo fuzz run ipc_import fuzz/corpus/ipc_import -- -runs=10000 -max_len=65536

  graphar:
    name: Maintained GraphAr (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install Arrow C++
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            wget -c "https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb" -P /tmp/
            sudo apt-get install -y "/tmp/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
            sudo apt-get update -y
            sudo apt-get install -y libarrow-dev libarrow-dataset-dev libarrow-acero-dev libarrow-compute-dev libparquet-dev
          else
            brew install apache-arrow
            arrow_prefix="$(brew --prefix apache-arrow)"
            echo "PKG_CONFIG_PATH=$arrow_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=$arrow_prefix:$(brew --prefix)" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$arrow_prefix/lib" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-I$arrow_prefix/include -Wno-error=deprecated-declarations -Wno-error=macro-redefined" >> "$GITHUB_ENV"
          fi
      - name: Test maintained GraphAr round-trip
        run: cargo test -p mrr-data-graphar --features native-graphar,selective-graphar,backend --locked
      - name: Verify GraphAr Arrow performance parity
        run: >-
          cargo test -p mrr-data-graphar --features native-graphar,selective-graphar,backend --locked
          scenario_semantically_reads_ten_thousand_graphar_edges --
          --ignored --nocapture
      - name: Qualify matched GraphAr range-read work
        run: >-
          cargo test -p mrr-data-graphar --features selective-graphar,backend --locked
          selective_matched_workload_experiment -- --ignored --nocapture
      - name: Measure GraphAr process RSS and retained-source reuse
        run: >-
          cargo bench -p mrr-data-graphar --bench graphar_range_workload
          --features selective-graphar,backend --profile test --locked -- --measure
      - name: Check facade GraphAr native feature
        run: |
          cargo check -p mrr-data --no-default-features --features graphar-native --locked
          cargo check -p mrr-data --no-default-features --features content-identity,graphar-native --locked
          cargo check -p mrr-data --no-default-features --features backend-graphar --locked
          cargo check -p mrr-data --no-default-features --features backend-graphar-selective --locked
      - name: Qualify Turso query over captured GraphAr
        run: |
          cargo test -p mrr-data-turso-query --features backend-worker --locked
          cargo check -p mrr-data --no-default-features --features backend-turso-query --locked
          cargo clippy -p mrr-data-turso-query --all-targets --features backend-worker --locked -- -D warnings
      - name: Qualify native graph publication, cold restore and final MRR admission
        run: |
          cargo test -p mrr-data --no-default-features --features backend-graphar,backend-graph-publish,backend-turso,backend-arrow-query,datafusion --lib --locked native_graph_publication_restoration_and_admission
          cargo test -p mrr-data --no-default-features --features backend-graphar,backend-graph-publish,backend-duckdb,backend-arrow-query,datafusion --lib --locked native_graph_publication_restoration_and_admission
      - name: Lint maintained GraphAr adapter
        run: cargo clippy -p mrr-data-graphar --all-targets --features native-graphar,selective-graphar,backend --profile test --locked -- -D warnings

  duckgql:
    name: Typed DuckGQL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python project manager
        run: python3 -m pip install 'uv==0.11.3'
      - name: Install Arrow C++
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            wget -c "https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb" -P /tmp/
            sudo apt-get install -y "/tmp/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
            sudo apt-get update -y
            sudo apt-get install -y libarrow-dev libarrow-dataset-dev libarrow-acero-dev libarrow-compute-dev libparquet-dev
          else
            brew install apache-arrow
            arrow_prefix="$(brew --prefix apache-arrow)"
            echo "PKG_CONFIG_PATH=$arrow_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=$arrow_prefix" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=$arrow_prefix/lib" >> "$GITHUB_ENV"
            echo "CXXFLAGS=-I$arrow_prefix/include -Wno-error=deprecated-declarations -Wno-error=macro-redefined" >> "$GITHUB_ENV"
          fi
      - name: Build pinned DuckGQL for the current SDK
        run: uv run --locked --project python mrr-data-test duckgql-build --work-dir "$RUNNER_TEMP/duckgql-build" --jobs 2
      - name: Select Host-built DuckGQL artifact
        shell: python
        run: |
          import json, os
          from pathlib import Path
          artifact = json.loads((Path(os.environ["RUNNER_TEMP"]) / "duckgql-build/artifact.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"MRR_DUCKGQL_EXTENSION={artifact['artifact']}\n")
              output.write(f"MRR_DUCKGQL_SHA256={artifact['sha256']}\n")
              output.write("MRR_DUCKGQL_ALLOW_UNSIGNED=1\n")
      - name: Qualify typed DuckGQL, retained output and native interrupt
        run: |
          cargo test -p mrr-data-duckgql-query --features backend-worker,query-parity --locked --no-run
          uv run --locked --project python mrr-data-test run-process --phase test -- cargo test -p mrr-data-duckgql-query --features backend-worker,query-parity --locked -- --nocapture
          cargo check -p mrr-data --no-default-features --features backend-duckgql-query --profile test --locked
          cargo clippy -p mrr-data-duckgql-query --all-targets --features backend-worker,query-parity --profile test --locked -- -D warnings
      - name: Record bounded whole-request query comparison
        run: uv run --locked --project python mrr-data-test run-process --phase test -- cargo test -p mrr-data-duckgql-query --features backend-worker,query-parity --locked same_source_scale_receipts -- --ignored --nocapture

  property-physical:
    name: Property snapshot and physical query (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test generic property snapshot and physical query
        run: |
          cargo test -p mrr-data-content --features property-snapshot --locked
          cargo test -p mrr-data-datafusion --locked
      - name: Lint generic property snapshot and physical query
        run: |
          cargo clippy -p mrr-data-content --features property-snapshot --all-targets --locked -- -D warnings
          cargo clippy -p mrr-data-datafusion --all-targets --locked -- -D warnings
